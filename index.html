<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumidityCast</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="application-name" content="HumidityCast">
    <meta name="apple-mobile-web-app-title" content="HumidityCast">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 16px;
            color: #E0E0E0;
        }
        h2 { margin-bottom: 4px; font-weight: 700; color: #FFFFFF; }
        .section-title { font-size: 1.1rem; margin-top: 24px; margin-bottom: 12px; color: #BB86FC; font-weight: 600; letter-spacing: 0.5px; }

        /* Current conditions: one full-width card */
        .current-container {
            display: flex;
            gap: 10px;
        }
        .current-card {
            flex: 1;
            border-radius: 12px;
            padding: 14px 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .current-card .emoji { font-size: 2.2rem; line-height: 1; }
        .current-card .dp { font-size: 1.6rem; font-weight: 700; color: #FFFFFF; }
        .current-card .label { font-size: 0.9rem; font-weight: 600; color: #FFFFFF; }

        /* Driest-hour readout: deliberately quiet, sits under the current card */
        .driest {
            margin-top: 10px;
            font-size: 0.78rem;
            line-height: 1.55;
            color: #A0A0A0;
            letter-spacing: 0.2px;
        }

        /* Hourly: 4 columns x 6 rows of thin single-line cells, filled top to
           bottom then left to right. The strip scrolls horizontally and each
           column is exactly half the visible width, so two columns (12 hours)
           sit on screen at a time and snapping lands cleanly on a column. */
        .hourly-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .hourly-col {
            flex: 0 0 calc(50% - 5px);
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-snap-align: start;
        }
        .hourly-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 3px 5px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 0;
        }
        .hourly-cell .time { font-weight: 700; font-size: 0.78rem; color: #FFFFFF; width: 28px; flex-shrink: 0; }
        .hourly-cell .emoji { font-size: 0.95rem; line-height: 1; flex-shrink: 0; }
        .hourly-cell .label {
            flex: 1;
            font-size: 0.68rem;
            font-weight: 600;
            color: #FFFFFF;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hourly-cell .dp { font-weight: 700; font-size: 0.85rem; color: #FFFFFF; flex-shrink: 0; }

        /* Daily: 2 columns x 3 rows, filled top to bottom then left to right.
           grid-auto-flow: column is what produces the down-then-over order. */
        .daily-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(3, auto);
            grid-auto-flow: column;
            gap: 10px;
        }
        .daily-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 10px;
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 0;
        }
        .daily-row .day { font-weight: 700; width: 24px; color: #FFFFFF; font-size: 1rem; flex-shrink: 0; }
        .daily-row .emoji { font-size: 1.2rem; flex-shrink: 0; }
        .daily-row .label {
            flex: 1;
            font-size: 0.8rem;
            font-weight: 600;
            color: #FFFFFF;
            padding: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .daily-row .dp { font-weight: 700; color: #FFFFFF; font-size: 1rem; flex-shrink: 0; }

        .loading { text-align: center; padding: 40px; font-size: 1.1rem; color: #A0A0A0; }
    </style>
</head>
<body>

    <h2>HumidityCast</h2>
    <div id="app-content">
        <div class="loading">Loading forecast data...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_KEY = "dBDd2NsSmaumAn6u4QatKmfMljuQTyFJ"; // <-- Put your actual Tomorrow.io API Key here

        // Set to false to hide the "Driest hour" lines entirely once things
        // are habitually drier and the readout stops earning its space.
        const SHOW_DRIEST_HOURS = true;

        // Local hour that ends the "before sleep" window (22 = 10:00 pm).
        const SLEEP_HOUR = 22;

        // Civil dawn is approximated as sunrise minus this many minutes.
        // Around Chicago's latitude civil twilight begins roughly 28-33 min
        // before sunrise depending on season, so 30 is close year-round.
        const CIVIL_DAWN_OFFSET_MIN = 30;

        // Hourly layout. COLS x ROWS is the total number of hours shown;
        // two of the four columns are visible at once (see .hourly-col).
        const HOURLY_COLS = 4;
        const HOURLY_ROWS = 6;

        // Days shown in the 6-day grid (2 columns x 3 rows).
        const DAILY_COUNT = 6;

        const LOCATION = { lat: 41.972907159856874, lon: -87.66423613246087 };  // Chicago

        const DOW2 = ['Su', 'M', 'T', 'W', 'H', 'F', 'Sa'];

        // Dark Primary Comfort Scale (0 to 5) — still used for label/emoji,
        // which are inherently discrete categories. `short` is an
        // abbreviated form for the tighter hourly/daily cards.
        function getComfort(dewPoint) {
            if (dewPoint >= 75) return { label: 'Oppressive', short: 'Oppr.', level: 5, emoji: '🔥' };
            if (dewPoint >= 70) return { label: 'Very Humid', short: 'V.Humid', level: 4, emoji: '🥵' };
            if (dewPoint >= 65) return { label: 'Humid', short: 'Humid', level: 3, emoji: '💦' };
            if (dewPoint >= 60) return { label: 'Sticky', short: 'Sticky', level: 2, emoji: '💧' };
            if (dewPoint >= 55) return { label: 'Pleasant', short: 'Pleasant', level: 1, emoji: '✨' };
            return { label: 'Refreshing', short: 'Fresh', level: 0, emoji: '🍃' };
        }

        // Continuous color on a cool-to-hot spectrum, so a 1°F change in dew
        // point never produces an abrupt jump the way discrete buckets did.
        // Green is confined to the comfortable end (Refreshing/Pleasant) and
        // burns off quickly through yellow so that Sticky/Humid/Very Humid/
        // Oppressive all stay in the amber-orange-red family — nothing in
        // the "uncomfortable" half of the scale should ever read as green.
        // Stops are (dewPoint, hue, saturation%, lightness%); color is
        // linearly interpolated between whichever two stops the current dew
        // point falls between, so the path is continuous with no seams.
        const COLOR_STOPS = [
            { dp: 45, h: 220, s: 70, l: 30 },  // Refreshing — blue
            { dp: 50, h: 175, s: 65, l: 28 },  // cool transition — teal
            { dp: 55, h: 130, s: 60, l: 26 },  // Pleasant — green
            { dp: 58, h: 70,  s: 65, l: 30 },  // warming fast — yellow
            { dp: 63, h: 35,  s: 85, l: 38 },  // Sticky→Humid boundary — amber
            { dp: 70, h: 15,  s: 90, l: 42 },  // Very Humid — deep orange
            { dp: 80, h: 0,   s: 90, l: 44 },  // Oppressive — red
        ];

        function lerp(a, b, t) { return a + (b - a) * t; }

        function getDewPointColor(dewPoint) {
            const stops = COLOR_STOPS;
            if (dewPoint <= stops[0].dp) {
                const s = stops[0];
                return `hsl(${s.h}, ${s.s}%, ${s.l}%)`;
            }
            const last = stops[stops.length - 1];
            if (dewPoint >= last.dp) {
                return `hsl(${last.h}, ${last.s}%, ${last.l}%)`;
            }
            for (let i = 0; i < stops.length - 1; i++) {
                const a = stops[i], b = stops[i + 1];
                if (dewPoint >= a.dp && dewPoint <= b.dp) {
                    const t = (dewPoint - a.dp) / (b.dp - a.dp);
                    const hue = lerp(a.h, b.h, t);
                    const sat = lerp(a.s, b.s, t);
                    const light = lerp(a.l, b.l, t);
                    return `hsl(${hue.toFixed(1)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`;
                }
            }
        }

        function calculateDewPoint(tempF, humidityPct) {
            const tempC = (tempF - 32) * (5 / 9);
            const a = 17.27, b = 237.7;
            const alpha = ((a * tempC) / (b + tempC)) + Math.log(humidityPct / 100.0);
            const dpC = (b * alpha) / (a - alpha);
            return dpC * 9 / 5 + 32;
        }

        // Pull a dew point out of a values object, calculating it if the API
        // didn't provide one directly.
        function getDP(values, tempKey, humKey) {
            return values.dewPoint ?? values.dewPointAvg ??
                calculateDewPoint(values[tempKey], values[humKey]);
        }

        const HOUR_MS = 3600000;

        // Shared by the driest-hour lines and the hourly cells.
        // 0 -> "12a", 11 -> "11a", 12 -> "12p", 23 -> "11p"
        function hourLabel(d) {
            let h = d.getHours();
            const suffix = h < 12 ? 'a' : 'p';
            h = h % 12;
            if (h === 0) h = 12;
            return `${h}${suffix}`;
        }

        // --- DRIEST-HOUR HELPERS ---------------------------------------
        // All of this runs once per forecast fetch over at most ~30 hourly
        // entries, so the cost is trivial and nothing re-computes on a timer.

        // Lowest dew point among the hourly entries that overlap
        // [now, windowEnd). Comparison is on the rounded (displayed) dew
        //
