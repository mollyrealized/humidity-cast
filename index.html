<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumidityCast</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="application-name" content="HumidityCast">
    <meta name="apple-mobile-web-app-title" content="HumidityCast">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 16px;
            color: #E0E0E0;
        }
        h2 { margin-bottom: 4px; font-weight: 700; color: #FFFFFF; }
        .section-title { font-size: 1.1rem; margin-top: 24px; margin-bottom: 12px; color: #BB86FC; font-weight: 600; letter-spacing: 0.5px; }

        /* Current conditions: one full-width card */
        .current-container {
            display: flex;
            gap: 10px;
        }
        .current-card {
            flex: 1;
            border-radius: 12px;
            padding: 14px 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .current-card .dp { font-size: 1.6rem; font-weight: 700; color: #FFFFFF; }
        .current-card .label { font-size: 0.9rem; font-weight: 600; color: #FFFFFF; }

        /* Driest-hour readout: deliberately quiet, sits under the current card */
        .driest {
            margin-top: 10px;
            font-size: 0.78rem;
            line-height: 1.55;
            color: #A0A0A0;
            letter-spacing: 0.2px;
        }

        /* Hourly: a borderless 24-column, 2-row table -- hour numbers on top,
           a solid humidity-color block underneath with no text in it. Using
           table-layout: fixed with width: 100% guarantees all 24 columns
           divide the available (portrait) screen width evenly, so the full
           24 hours always fit on screen at once with no horizontal scroll. */
        .hourly-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin: 0;
        }
        .hourly-table td {
            padding: 0;
            margin: 0;
            text-align: center;
        }
        .hourly-table .hourly-hours td {
            font-size: clamp(6px, 2.6vw, 11px);
            line-height: 1.3;
            font-weight: 600;
            color: #E0E0E0;
        }
        .hourly-table .hourly-blocks td {
            height: 26px;
        }
        .hourly-block {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Daily: 2 columns x 3 rows, filled top to bottom then left to right.
           grid-auto-flow: column is what produces the down-then-over order. */
        .daily-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(3, auto);
            grid-auto-flow: column;
            gap: 10px;
        }
        .daily-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 10px;
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 0;
        }
        .daily-row .day { font-weight: 700; width: 24px; color: #FFFFFF; font-size: 1rem; flex-shrink: 0; }
        .daily-row .label {
            flex: 1;
            font-size: 0.8rem;
            font-weight: 600;
            color: #FFFFFF;
            padding: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .daily-row .dp { font-weight: 700; color: #FFFFFF; font-size: 1rem; flex-shrink: 0; }

        .stamp { margin-top: 18px; font-size: 0.7rem; color: #6E6E6E; letter-spacing: 0.2px; }

        .loading { text-align: center; padding: 40px; font-size: 1.1rem; color: #A0A0A0; }

        /* Error state: says what actually went wrong instead of guessing. */
        .error-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            background-color: #2A1A1E;
            border: 1px solid #CF6679;
        }
        .error-title { font-weight: 700; color: #CF6679; margin-bottom: 8px; font-size: 1rem; }
        .error-detail {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #E0E0E0;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .retry-btn {
            margin-top: 14px;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background-color: #3A2A2E;
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
        }

        /* Force-update bar: always visible at the bottom, independent of
           app-content, so it works even while the app is showing an error. */
        .update-bar { margin-top: 28px; text-align: center; }
        .update-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background-color: #1E1E1E;
            color: #E0E0E0;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
        }
        .update-btn:disabled { opacity: 0.6; }
        .update-status { display: block; margin-top: 6px; font-size: 0.7rem; color: #6E6E6E; }
    </style>
</head>
<body>

    <h2>HumidityCast</h2>
    <div id="app-content">
        <div class="loading">Loading forecast data...</div>
    </div>

    <div class="update-bar">
        <button id="force-update-btn" class="update-btn" type="button">Force Update</button>
        <span id="update-status" class="update-status"></span>
    </div>

    <script>
        // --- ERROR TRAP -------------------------------------------------
        // Deliberately its own <script> block, placed before the main one.
        // A syntax error inside a script block kills that entire block, so a
        // handler installed in the same block would never register and the
        // page would sit on "Loading..." forever with nothing explaining why.
        // Registered here, it survives to report on the block below it.
        window.__rendered = false;

        window.showError = function (message) {
            if (window.__rendered) return;
            var el = document.getElementById('app-content');
            if (!el) return;
            var safe = String(message).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
            el.innerHTML =
                '<div class="error-box">' +
                    '<div class="error-title">Couldn\'t load the forecast</div>' +
                    '<div class="error-detail">' + safe + '</div>' +
                    (typeof window.__retry === 'function'
                        ? '<button id="retry-btn" class="retry-btn">Retry</button>'
                        : '') +
                '</div>';
            var btn = document.getElementById('retry-btn');
            if (btn) {
                btn.addEventListener('click', function () {
                    el.innerHTML = '<div class="loading">Loading forecast data...</div>';
                    window.__retry();
                });
            }
        };

        window.addEventListener('error', function (e) {
            var where = e.filename ? ' [' + e.filename + (e.lineno ? ':' + e.lineno : '') + ']' : '';
            window.showError('Script error: ' + (e.message || 'unknown') + where);
        });

        window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            window.showError('Unhandled rejection: ' + ((r && r.message) || r));
        });
    </script>

    <script>
        // --- CONFIGURATION ---
        const API_KEY = "dBDd2NsSmaumAn6u4QatKmfMljuQTyFJ"; // <-- Put your actual Tomorrow.io API Key here

        // Set to false to hide the "Driest hour" lines entirely once things
        // are habitually drier and the readout stops earning its space.
        const SHOW_DRIEST_HOURS = true;

        // Local hour that ends the "before sleep" window (22 = 10:00 pm).
        const SLEEP_HOUR = 22;

        // Civil dawn is approximated as sunrise minus this many minutes.
        // Around Chicago's latitude civil twilight begins roughly 28-33 min
        // before sunrise depending on season, so 30 is close year-round.
        const CIVIL_DAWN_OFFSET_MIN = 30;

        // Hard ceiling on the API call. Without this a request that opens but
        // never answers leaves the page on "Loading..." indefinitely, since a
        // promise that never settles reaches neither the render nor the catch.
        const FETCH_TIMEOUT_MS = 15000;

        // Number of hours shown in the humidity bar (one column per hour).
        const HOURLY_COUNT = 24;

        // Days shown in the 6-day grid (2 columns x 3 rows).
        const DAILY_COUNT = 6;

        const LOCATION = { lat: 41.972907159856874, lon: -87.66423613246087 };  // Chicago

        const DOW2 = ['Su', 'M', 'T', 'W', 'H', 'F', 'Sa'];

        // Fixed six-color comfort scale, worst (overwhelming) to best
        // (refreshing). No gradient/interpolation -- every dew point maps to
        // exactly one of these six colors. `short` is an abbreviated label
        // for the tighter daily cards.
        // `text` is the readable text color for that background -- yellow and
        // light blue are too light for white text, so they get black instead.
		const COMFORT_LEVELS = [
			{ min: 75,        label: 'Oppressive',  short: 'Oppr.',    color: '#FF0000', text: '#FFFFFF' },
			{ min: 70,        label: 'Very Humid',  short: 'V.Humid',  color: '#FF4C4C', text: '#FFFFFF' },
			{ min: 65,        label: 'Humid',       short: 'Humid',    color: '#FF8888', text: '#000000' },
			{ min: 60,        label: 'Sticky',      short: 'Sticky',   color: '#FFC8C8', text: '#000000' },
			{ min: 55,        label: 'Pleasant',    short: 'Pleasant', color: '#00FFFF', text: '#000000' },
			{ min: -Infinity, label: 'Refreshing',  short: 'Fresh',    color: '#0000FF', text: '#FFFFFF' },
		];

        function getComfort(dewPoint) {
            for (const level of COMFORT_LEVELS) {
                if (dewPoint >= level.min) return level;
            }
        }

        function getDewPointColor(dewPoint) {
            return getComfort(dewPoint).color;
        }

        function calculateDewPoint(tempF, humidityPct) {
            const tempC = (tempF - 32) * (5 / 9);
            const a = 17.27, b = 237.7;
            const alpha = ((a * tempC) / (b + tempC)) + Math.log(humidityPct / 100.0);
            const dpC = (b * alpha) / (a - alpha);
            return dpC * 9 / 5 + 32;
        }

        // Pull a dew point out of a values object, calculating it if the API
        // didn't provide one directly.
        function getDP(values, tempKey, humKey) {
            return values.dewPoint ?? values.dewPointAvg ??
                calculateDewPoint(values[tempKey], values[humKey]);
        }

        const HOUR_MS = 3600000;

        // Shared by the driest-hour lines and the hourly cells.
        // 0 -> "12a", 11 -> "11a", 12 -> "12p", 23 -> "11p"
        function hourLabel(d) {
            let h = d.getHours();
            const suffix = h < 12 ? 'a' : 'p';
            h = h % 12;
            if (h === 0) h = 12;
            return `${h}${suffix}`;
        }

        // --- DRIEST-HOUR HELPERS ---------------------------------------
        // All of this runs once per forecast fetch over at most ~30 hourly
        // entries, so the cost is trivial and nothing re-computes on a timer.

        // Lowest dew point among the hourly entries that overlap
        // [now, windowEnd). Comparison is on the rounded (displayed) dew
        // point. Consecutive hours sharing that minimum merge into one span;
        // separate spans that tie are broken by the lower actual temperature,
        // then by whichever comes first.
        function driestSpan(hours, windowEnd, now) {
            const candidates = [];
            for (const h of hours) {
                const start = new Date(h.time);
                if (start.getTime() + HOUR_MS <= now.getTime()) continue;
                if (start >= windowEnd) break;
                candidates.push({
                    start: start,
                    dp: Math.round(getDP(h.values, 'temperature', 'humidity')),
                    temp: h.values.temperature ?? Number.POSITIVE_INFINITY
                });
            }
            if (candidates.length === 0) return null;

            let min = candidates[0].dp;
            for (const c of candidates) if (c.dp < min) min = c.dp;

            const runs = [];
            let current = null;
            for (const c of candidates) {
                if (c.dp !== min) { current = null; continue; }
                if (current && c.start.getTime() === current.end.getTime()) {
                    current.end = new Date(c.start.getTime() + HOUR_MS);
                    if (c.temp < current.minTemp) current.minTemp = c.temp;
                } else {
                    current = {
                        start: c.start,
                        end: new Date(c.start.getTime() + HOUR_MS),
                        minTemp: c.temp
                    };
                    runs.push(current);
                }
            }

            let best = runs[0];
            for (const r of runs) if (r.minTemp < best.minTemp) best = r;

            return { dp: min, label: `${hourLabel(best.start)}-${hourLabel(best.end)}` };
        }

        // First civil dawn after `now`, derived from the daily timeline's
        // sunrise times. Falls back to now + 24h if sunrise data is absent.
        function getNextCivilDawn(data, now) {
            const daily = (data.timelines && data.timelines.daily) || [];
            for (const d of daily) {
                const sunrise = d.values.sunriseTime;
                if (!sunrise) continue;
                const dawn = new Date(new Date(sunrise).getTime() - CIVIL_DAWN_OFFSET_MIN * 60000);
                if (dawn > now) return dawn;
            }
            return new Date(now.getTime() + 24 * HOUR_MS);
        }

        function renderDriest(data) {
            const now = new Date();
            const hours = data.timelines.hourly;

            const sleepEnd = new Date(now);
            sleepEnd.setHours(SLEEP_HOUR, 0, 0, 0);
            const sleepPassed = sleepEnd <= now;
            const sleepSpan = sleepPassed ? null : driestSpan(hours, sleepEnd, now);

            const dawnEnd = getNextCivilDawn(data, now);
            const dawnSpan = driestSpan(hours, dawnEnd, now);

            const sleepText = sleepPassed ? '(passed)' : (sleepSpan ? sleepSpan.label : '—');
            const dawnText = dawnSpan ? dawnSpan.label : '—';

            return `
                <div class="driest">
                    <div>Driest hour (before sleep): ${sleepText}</div>
                    <div>Driest hour (before dawn): ${dawnText}</div>
                </div>`;
        }

        // Aborts rather than hanging, reports the real HTTP status and body,
        // and bypasses any cache (including a service worker's) so a stale
        // entry can't be served in place of a live forecast.
        async function fetchForecast(loc) {
            const controller = new AbortController();
            const timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
            const url = `https://api.tomorrow.io/v4/weather/forecast?location=${loc.lat},${loc.lon}&apikey=${API_KEY}&units=imperial`;
            try {
                const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                if (!response.ok) {
                    let detail = '';
                    try { detail = (await response.text()).slice(0, 300); } catch (e) { /* body unreadable */ }
                    throw new Error(`api.tomorrow.io returned HTTP ${response.status}.\n${detail}`);
                }
                return await response.json();
            } catch (err) {
                if (err.name === 'AbortError') {
                    throw new Error(`No response from api.tomorrow.io within ${FETCH_TIMEOUT_MS / 1000} seconds. The request opened but never came back.`);
                }
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }

        // "Now" = first minutely entry if present, otherwise first hourly entry.
        function getCurrentValues(data) {
            const min = data.timelines.minutely;
            if (min && min.length > 0) return min[0].values;
            return data.timelines.hourly[0].values;
        }

        async function fetchWeather() {
            try {
                const data = await fetchForecast(LOCATION);

                if (!data || !data.timelines || !data.timelines.hourly || !data.timelines.daily) {
                    throw new Error('The API answered, but the response had no hourly/daily timelines in it.');
                }

                let html = '';

                // --- CURRENT CONDITIONS ---
                const nowValues = getCurrentValues(data);
                const nowDp = getDP(nowValues, 'temperature', 'humidity');
                const nowComfort = getComfort(nowDp);
                html += `
                    <div class="section-title">Right Now</div>
                    <div class="current-container">
                        <div class="current-card" style="background-color: ${nowComfort.color}; color: ${nowComfort.text}">
                            <div class="dp" style="color: ${nowComfort.text}">${Math.round(nowDp)}°F</div>
                            <div class="label" style="color: ${nowComfort.text}">${nowComfort.label}</div>
                        </div>
                    </div>`;

                // --- DRIEST HOURS ---
                if (SHOW_DRIEST_HOURS) {
                    html += renderDriest(data);
                }

                // --- HOURLY (borderless 24-column humidity bar: hour numbers
                //     on top, a solid color block underneath) ---
                const hours = data.timelines.hourly.slice(0, HOURLY_COUNT);

                let hourCells = '';
                let blockCells = '';
                hours.forEach(h => {
                    const dp = getDP(h.values, 'temperature', 'humidity');
                    const hh = String(new Date(h.time).getHours()).padStart(2, '0');
                    hourCells += `<td>${hh}</td>`;
                    blockCells += `<td><div class="hourly-block" style="background-color: ${getDewPointColor(dp)}"></div></td>`;
                });

                html += `
                    <div class="section-title">Next 24 Hours</div>
                    <table class="hourly-table"><tbody>
                        <tr class="hourly-hours">${hourCells}</tr>
                        <tr class="hourly-blocks">${blockCells}</tr>
                    </tbody></table>`;

                // --- DAILY (grid-auto-flow: column puts days 1-3 in the left
                //     column and days 4-6 in the right) ---
                const dailyData = data.timelines.daily.slice(0, DAILY_COUNT);

                html += `<div class="section-title">6-Day Forecast</div><div class="daily-container">`;
                dailyData.forEach(d => {
                    const dp = getDP(d.values, 'temperatureAvg', 'humidityAvg');
                    const comfort = getComfort(dp);
                    const dayLabel = DOW2[new Date(d.time).getDay()];
                    html += `
                        <div class="daily-row" style="background-color: ${comfort.color}; color: ${comfort.text}">
                            <div class="day" style="color: ${comfort.text}">${dayLabel}</div>
                            <div class="label" style="color: ${comfort.text}">${comfort.short}</div>
                            <div class="dp" style="color: ${comfort.text}">${Math.round(dp)}°F</div>
                        </div>`;
                });
                html += `</div>`;

                // Fetch time, so a page held in a cache is obvious at a glance.
                html += `<div class="stamp">Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>`;

                document.getElementById('app-content').innerHTML = html;
                window.__rendered = true;
            } catch (err) {
                window.showError((err && err.message) ? err.message : String(err));
            }
        }

        // Lets the Retry button re-run the fetch without a full page reload.
        window.__retry = fetchWeather;

        // Registration failure must not surface as an unhandled rejection and
        // paint an error over an otherwise working forecast.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function () { /* no service worker available */ });
        }

        // Force Update: unregisters every service worker for this page and
        // clears every cache it created, then reloads. This is the manual
        // equivalent of clearing site data in browser settings, without
        // having to leave the page -- needed because a plain reload can
        // keep serving whatever the service worker already cached.
        async function forceUpdate() {
            const btn = document.getElementById('force-update-btn');
            const status = document.getElementById('update-status');
            if (btn) btn.disabled = true;
            if (status) status.textContent = 'Updating…';
            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(r => r.unregister()));
                }
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                }
            } catch (e) {
                // Reload anyway -- a partial cleanup is still better than none.
            }
            location.reload();
        }

        const forceUpdateBtn = document.getElementById('force-update-btn');
        if (forceUpdateBtn) forceUpdateBtn.addEventListener('click', forceUpdate);

        fetchWeather();
    </script>
</body>
</html>
